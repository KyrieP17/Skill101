# Study template: copy to <project>/config/studies/<study_id>.toml and edit.
# Fields, defaults and validation rules: references/study-design.md.
#
# Only [periods] changes which DataWeb queries run.  Everything else is an
# analysis setting with a default: fill it in, show it to the user, and let
# them change it at any time.  Every query already returns all origins plus an
# independent World total, so those changes need no new plan or download.

[study]
study_id = "example-product-2017-2025"      # lowercase slug, unique per study
title = "One-sentence research question"
scope_manifest = "scopes/example-product/v1/manifest.json"   # frozen, approved scope

[periods]
# Default: the longest window the approved scope covers, up to the last
# complete year.  Add monthly only when the question needs event timing.
annual = { start = 2017, end = 2025 }
monthly = { start = 2023, end = 2026 }

[origins]
focal = "China"            # default unless the question is about another origin
highlight = []             # at most 6: the user's list, or the largest origins once data is in

[comparison]
# Two complete years inside periods.annual; remove the table to skip.
base_year = 2024
compare_year = 2025

# One table per window, YYYY-MM, inside periods.monthly.
[[event_windows]]
id = "baseline"
label = "Before the policy change"
start = "2024-11"
end = "2025-01"

[events]
ids = []                   # event_id values from config/policy_events.csv

# --- Optional features: each is off when its table is left out. -------------

# Tariff timeline (one file per scope, plus the shared per-origin layer).
# Rows enter study_sha256 only; the agent writes review_status = "draft".
[timeline]
file = "config/tariff_timelines/example-product.csv"
country = "config/tariff_timelines/_country.csv"

# Default for a new study: the three-row table (focal / other / total) with
# calculated duty in USD, used by the brief's key numbers.  candidates adds
# tables/mention_list.csv (what the brief must mention; brief-check looks for
# each item) and tables/window_candidates.csv (decomposition windows).
[brief]
focal_split = true
candidates = true

# Rule flags for the brief's questions -> tables/anomaly_flags.csv: new or
# near-zero origins, realized duty below the base rate, unit value outliers,
# surges before timeline dates, count against weight.
[anomalies]
enabled = true

# When the scope records a second_unit (e.g. kg), default to "both": the first
# unit stays in the main columns and the second unit sits beside it.  Remove
# the table when the scope has no second unit.
[quantity]
unit = "both"

# Segments join codes into one series, e.g. HTS10 lines split mid-study.
# Codes must be included in the scope and may appear in one segment only.
# [[segments]]
# label = "Segment A"
# codes = ["0000000010"]

# Drill-down menu (HTS8 / HTS10 verdicts from the product and its rates only):
# the HTS REST search for the scope's HTS6, saved unchanged in the scope's
# history/ by hts_scope_resolver.py --keyword 0000.00 --structure-output <this
# path>, which prints the URL, bytes and SHA-256 to record in SOURCES.md.
[drilldown]
structure = "scopes/example-product/v1/history/hts_rest_search_0000.00.json"
# Required when [tariff_snapshot] is enabled. This JSON sidecar records
# schema_version=1, release_id, effective_date, structure_file, the approved
# acquisition source_url and source_sha256; the pipeline cross-checks them.
# Copy assets/hts_release_metadata_template.json beside the structure first.
release_metadata = "scopes/example-product/v1/history/hts_rest_search_0000.00.release.json"

# Optional measured HTS10 import mix for an HTS6 study. This adds exactly two
# annual DataWeb jobs for the selected full year: all reported origins and an
# independent World total. The release sidecar above must be effective in the
# same year and match every approved HTS6 scope line for that year.
# [product_mix]
# period = 2025

# Optional non-binding HTS-based tariff treatment snapshot.  It resolves each
# HTS8/HTS10 child for the explicit entry assumptions and writes
# tables/tariff_treatment_snapshot.csv.  entry_date never defaults to today;
# hts_release_date must be no later than entry_date and the structure above
# must be that archived HTS release.  Never use today's structure to backcast
# a historical entry.  V1 covers Column 1-General plus verified Chapter 99
# layers for ordinary consumption entries.
# [tariff_snapshot]
# entry_date = "2025-09-30"
# hts_release_id = "2025HTSRev19"
# hts_release_date = "2025-07-01"
# origins = ["China"]
# rate_column = "general"
# preference_claim = "none"
# entry_type = "consumption"
# chapter_98 = false
# quota_or_trq = false
# ad_cvd = false
# firm_specific_rate = false
# requires_binding_classification = false

# External industry-cycle context is opt-in.  "light" only adds a separately
# labeled optional web-research item to tables/next_steps.csv; it does not
# browse or authorize browsing.  Keep off for a DataWeb-only study.
[industry_context]
mode = "off"

# [drilldown] also writes tables/product_hierarchy_matrix.csv. HTS10 shares
# stay unavailable unless [product_mix] acquires same-period HTS10 all-origin
# and independent World data and reconciles it to the separately queried
# parent HTS6 World total.
# Every run writes tables/proxy_notes.csv and at most three next_steps rows.

# Change decomposition -> tables/share_decomposition.csv: each origin's share
# change split into its own value and all other origins, value change split
# into quantity and unit value, for consecutive years and months, the YTD and
# each month pair in windows.  Add windows after the first run, from
# tables/window_candidates.csv (suggested = true).  mix splits the unit-value
# part into price within codes and the shift between codes: on when the scope
# has two or more codes.
[decomposition]
enabled = true
mix = true
# windows = [["2024-12", "2025-02"]]

# Numbers the brief needs that no table holds -> tables/calculations.csv, one
# row per origin, measure and stat, with the formula and the sums it used.
# Never add, average or divide in chat: declare it here and re-run analyze.
# [[derived]]
# id = "q1-total"
# label = "Q1 imports, 2025 against 2024"
# origin = ["World", "China", "Other origins"]   # Other origins = World - focal
# measure = ["value", "share"]   # value quantity duty share quantity_share unit_value realized_duty
# stat = "total"                 # total (default), mean, min, max
# window = ["2025-01", "2025-03"]   # "YYYY-MM", "YYYY" or [first, last]
# base = ["2024-01", "2024-03"]     # optional, same kind as window
