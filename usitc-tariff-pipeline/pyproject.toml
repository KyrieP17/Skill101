[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "usitc-tariff-pipeline"
version = "0.2.0"
description = "Reproducible USITC DataWeb tariff and sourcing research pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "requests>=2.31",
]

[project.scripts]
usitc-pipeline = "usitc_pipeline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

