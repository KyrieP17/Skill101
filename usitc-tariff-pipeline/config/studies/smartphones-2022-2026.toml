[[derived]]
id = "duty-2025-months"
label = "Realized duty, lowest and highest month of 2025"
origin = ["India", "Vietnam", "Other reported origins"]
measure = "realized_duty"
stat = ["min", "max"]
window = ["2025-01", "2025-12"]

[[derived]]
id = "china-share-ranges"
label = "China share, lowest and highest month: Jul-Dec 2024 and Jan-Aug 2026"
origin = "China"
measure = "share"
stat = ["min", "max"]
window = ["2026-01", "2026-08"]
base = ["2024-07", "2024-12"]
